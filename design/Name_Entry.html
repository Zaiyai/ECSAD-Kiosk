</head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col"><main class="flex flex-col relative w-full px-margin bg-surface flex-1 justify-center min-h-[100dvh] py-space-xl"><div class="flex flex-col w-full gap-space-lg pb-space-xl">
<!-- Top Hospitality Header & Badge -->
<div class="flex flex-col gap-space-sm pt-space-sm items-center text-center">
<div class="flex flex-col items-center gap-space-sm mb-space-xs"><div class="relative w-36 h-36 rounded-full p-1.5 bg-surface-container-lowest shadow-2xl ring-8 ring-primary/15 overflow-hidden flex items-center justify-center my-space-sm"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_P_eJNBy6XfyhK_gIGcFXLKCuEJhmiV9sprXDZ6IsUIeyn2lIh2BQPhhDt3IV8NMYt-DASbocllJf9_7O3XpWdEorZ3cQg5_8JDj_hECQhENnm5po-A0wjk9zDbMRXzK3IdbGTJf8N1QrOp1JpZz8kooQY0AG9tp69VnLhCDfDCF0_roPqEGE3G9MLe1XCj3KN_5ECfXXAhOO2UbYz4hQvpyUDXPilqfeXKkYpFt_cATWyjMTB-cy" alt="ECSAD Logo" class="w-full h-full rounded-full object-cover shrink-0"></div><div class="inline-flex items-center gap-space-xs px-space-md py-1 rounded-full bg-primary-fixed/80 border border-primary/15"><span class="w-1.5 h-1.5 rounded-full bg-primary"></span><span class="font-label-sm text-label-sm uppercase tracking-widest text-primary font-bold">ECSAD Defense • Panelist Kiosk</span></div></div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mt-space-xs">Welcome, Panelist</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
      Order your breakfast and lunch for today’s defense.
    </p>
</div>
<!-- Warm Café Visual Card -->

<!-- Name Entry Card -->
<form class="flex flex-col gap-space-md bg-surface-container-lowest rounded-xl p-space-lg shadow-sm border border-outline-variant/40" id="panelist-entry-form" novalidate="">
<div class="flex flex-col gap-space-xs">
<label class="font-headline-sm text-headline-sm text-on-surface" for="panelist-name">
        Your Name
      </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-space-md text-primary text-[20px] pointer-events-none">
          badge
        </span>
<input autocomplete="name" class="w-full h-13 pl-11 pr-space-md py-3 rounded-lg bg-surface-container-low text-on-surface placeholder:text-outline border border-outline-variant/60 font-body-lg text-body-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" id="panelist-name" name="panelistName" placeholder="e.g., Dr. Maria Santos" type="text">
</div>
<p class="hidden font-body-sm text-body-sm text-error flex items-center gap-space-xs mt-space-xs" id="name-error">
<span class="material-symbols-outlined text-[16px]">error</span>
<span>Please enter your name so the kitchen knows who to serve.</span>
</p>
</div>
<!-- Subtle Helper Note -->

<!-- Primary Full-Width CTA -->
<button class="w-full min-h-[48px] px-space-lg py-3 rounded-full bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md shadow-primary/25 active:scale-[0.98] transition-all mt-space-xs" id="start-ordering-btn" type="submit">
<span>Start Ordering</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Quick Reassurance Footer -->
<div class="flex items-center justify-center pt-space-xs"><a href="/kitchen" class="inline-flex items-center gap-space-xs text-secondary hover:text-primary font-body-sm text-body-sm transition-colors group"><span>Are you kitchen staff?</span><span class="font-label-sm font-semibold underline underline-offset-4 group-hover:text-primary">Kitchen Portal →</span></a></div>
</div>
<script>
  (function () {
    const form = document.getElementById('panelist-entry-form');
    const nameInput = document.getElementById('panelist-name');
    const nameError = document.getElementById('name-error');
    const submitBtn = document.getElementById('start-ordering-btn');

    if (!form || !nameInput || !nameError || !submitBtn) return;

    const savedName = localStorage.getItem('ecsad_panelist_name');
    if (savedName) {
      nameInput.value = savedName;
    }

    nameInput.addEventListener('input', function () {
      if (nameInput.value.trim().length > 0) {
        nameError.classList.add('hidden');
      }
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const enteredName = nameInput.value.trim();

      if (!enteredName) {
        nameError.classList.remove('hidden');
        nameInput.focus();
        return;
      }

      localStorage.setItem('ecsad_panelist_name', enteredName);
      submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Opening Menu...</span>';
      submitBtn.disabled = true;
    });
  })();
</script></main>

</body></html>
