      } else {
        card.classList.remove('bg-primary-fixed/60', 'text-on-primary-fixed', 'border-primary');
        card.classList.add('bg-surface-container-lowest', 'text-on-surface', 'border-transparent');
        if (subtext) {
          subtext.classList.remove('text-on-primary-fixed-variant');
          subtext.classList.add('text-on-surface-variant');
        }
        if (mode === 'multi') {
          indicator.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
          indicator.classList.add('bg-surface-container-high', 'text-transparent');
        } else {
          indicator.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
          indicator.classList.add('bg-surface-container-high', 'border-outline-variant');
          const dot = indicator.querySelector('span');
          if (dot) {
            dot.classList.remove('bg-on-primary');
            dot.classList.add('bg-transparent');
          }
        }
      }
    }

    function updateSummary() {
      const selectedCards = document.querySelectorAll('.option-card[data-selected="true"]');
      const names = Array.from(selectedCards).map(c => c.getAttribute('data-option'));
      countEl.textContent = `${names.length} item${names.length === 1 ? '' : 's'} selected`;
      summaryEl.textContent = names.length > 0 ? names.join(', ') : 'Tap an item to begin';
    }

    groups.forEach(group => {
      const mode = group.getAttribute('data-mode');
      const cards = group.querySelectorAll('.option-card');

      cards.forEach(card => {
        card.addEventListener('click', () => {
          if (mode === 'multi') {
            const currentlySelected = card.getAttribute('data-selected') === 'true';
            updateCardVisual(card, !currentlySelected, 'multi');
          } else {
            cards.forEach(c => updateCardVisual(c, c === card, 'single'));
          }
          updateSummary();
        });
      });
    });
  })();
</script></main>
